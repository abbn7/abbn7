name: Update profile activity
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-activity
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate statistics, graph and animated snake from GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_activity.py --username abbn7
      - name: Commit changed activity assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/activity-*.svg assets/stats-*.svg assets/streak-*.svg assets/snake-*.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh GitHub profile statistics and snake'
            git push
          fi
